
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AceOSWare</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000 url("glitch.gif") center center / cover no-repeat fixed;
      font-family: Verdana, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock-container {
      text-align: center;
      color: white;
      z-index: 2;
      padding: 20px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.5),
        0 0 25px rgba(207,3,252,0.4),
        2px 2px 5px black;
    }

    #clock {
      font-size: clamp(55px, 12vw, 150px);
      font-weight: bold;
      letter-spacing: 4px;
    }

    #date {
      font-size: clamp(16px, 2vw, 25px);
      margin-top: 20px;
      letter-spacing: 4px;
      color: #cf03fc;
    }

    .music-player {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.35;
      transition: opacity 0.3s;
    }

    .music-player:hover {
      opacity: 1;
    }

    audio {
      width: 250px;
      height: 35px;
    }
  </style>
</head>

<body>

  <div class="clock-container">
    <div id="clock">00:00:00</div>
    <div id="date">Loading...</div>
  </div>

  <div class="music-player">
    <audio id="music" autoplay loop controls preload="auto">
      <source src="lotus.mp3" type="audio/mpeg">
      Your browser does not support audio.
    </audio>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      document.getElementById("clock").textContent =
        now.toLocaleTimeString(undefined, {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });

      document.getElementById("date").textContent =
        now.toLocaleDateString(undefined, {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        });
    }

    updateClock();
    setInterval(updateClock, 1000);

    const music = document.getElementById("music");
    music.volume = 0.5;

    music.play().catch(() => {
      console.log("Click play to start the music.");
    });
  </script>

</body>
</html>
